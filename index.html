<script>

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhrZGZjcWFueXRnemRxcmtqbHFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MjQ1NzksImV4cCI6MjA5ODQwMDU3OX0.aayD6SKis2gX4Vw14xMcdyBJpKWX3CfePg3VO4Sy0JQ';

const BUYIN_VALUE = 200;

let PLAYER_COLORS = {
  Vikrant:'#f59e0b', Dhal:'#3b82f6', Rathore:'#a855f7', Alok:'#10b981',
  Totala:'#f97316', SV:'#ec4899', Suneet:'#06b6d4', Lavish:'#84cc16', Savya:'#14b8a6'

let PLAYER_IMAGES = {};

// ── BACKEND SELECTION ─────────────────────────────────────────────────────────
// 'local'    → browser localStorage, for testing without touching Supabase.
// 'supabase' → the real hosted database.
// Flip to 'supabase' once everything works locally.
const BACKEND = 'supabase';

// ── LOCAL BACKEND (localStorage) ───────────────────────────────────────────────
// Minimal drop-in for the subset of the Supabase JS query builder this app uses:
// .from(table).select()/.insert()/.update()/.delete(), .eq/.order/.limit/.single(),
// embedded selects ('*, child(*)'), cascade deletes, and the 23505 unique code.
// Each query is a thenable, so `await db.from(...)...` works unchanged.
const LOCAL_STORAGE_KEY = 'poker_local_db';
// parent table → [{ childTable, fk }] for embedded selects and cascade deletes.
const LOCAL_RELATIONS = {
  active_session: [
    { childTable: 'active_session_buyins',    fk: 'active_session_id' },
    { childTable: 'active_session_buyin_log', fk: 'active_session_id' },
  ],
  sessions: [
    { childTable: 'session_results', fk: 'session_id' },
  ],
};

function createLocalDb() {
  function loadAll() {
    try { return JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY)) || {}; }
    catch(e) { return {}; }
  }
  function saveAll(data) { localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data)); }
  function table(data, name) { if (!data[name]) data[name] = []; return data[name]; }
  function newId() { return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2)); }

  // Seed the players table from the hardcoded defaults so the app is usable immediately.
  (function seed() {
    const data = loadAll();
    if (!data.players) {
      data.players = PLAYERS.map((name, i) => ({
        id: newId(), name, color: PLAYER_COLORS[name] || '#888',
        active: true, image_url: null, created_at: new Date(Date.now() + i).toISOString(),
      }));
      saveAll(data);
    }
  })();

  function embed(data, rows, selectStr) {
    // Attach any embedded child collections referenced as `child(*)` in the select.
    (selectStr.match(/(\w+)\s*\(/g) || []).forEach(m => {
      const child = m.replace(/\s*\($/, '');
      const rel = Object.values(LOCAL_RELATIONS).flat().find(r => r.childTable === child);
      if (!rel) return;
      const childRows = table(data, child);
      rows.forEach(row => { row[child] = childRows.filter(c => c[rel.fk] === row.id); });
    });
    return rows;
  }

  class LocalQuery {
    constructor(name) {
      this.name = name; this.op = 'select'; this.selectStr = '*';
      this.filters = []; this.orderBy = null; this._limit = null;
      this._single = false; this._returnRows = false; this.payload = null;
    }
    select(str = '*') { if (this.op === 'select') this.selectStr = str; else this._returnRows = true; if (str && str !== '*') this.selectStr = str; return this; }
    insert(rows) { this.op = 'insert'; this.payload = Array.isArray(rows) ? rows : [rows]; return this; }
    update(patch) { this.op = 'update'; this.payload = patch; return this; }
    delete() { this.op = 'delete'; return this; }
    eq(col, val) { this.filters.push([col, val]); return this; }
    order(col, opts = {}) { this.orderBy = { col, ascending: opts.ascending !== false }; return this; }
    limit(n) { this._limit = n; return this; }
    single() { this._single = true; return this; }

    _match(row) { return this.filters.every(([c, v]) => row[c] === v); }

    _run() {
      const data = loadAll();
      const rows = table(data, this.name);
      try {
        if (this.op === 'insert') {
          const inserted = this.payload.map(r => {
            if (this.name === 'players' && rows.some(x => x.name === r.name))
              throw { code: '23505', message: 'duplicate key value' };
            return { id: newId(), created_at: new Date().toISOString(), ...r };
          });
          // Second pass so a duplicate in a multi-row insert doesn't partially write.
          inserted.forEach(r => rows.push(r));
          saveAll(data);
          const out = JSON.parse(JSON.stringify(inserted));
          if (this._returnRows || this._single) return { data: this._single ? (out[0] || null) : out, error: null };
          return { data: null, error: null };
        }
        if (this.op === 'update') {
          const patch = this.payload;
          rows.filter(r => this._match(r)).forEach(r => Object.assign(r, patch));
          saveAll(data);
          return { data: null, error: null };
        }
        if (this.op === 'delete') {
          const toDelete = rows.filter(r => this._match(r));
          const rels = LOCAL_RELATIONS[this.name] || [];
          const ids = new Set(toDelete.map(r => r.id));
          rels.forEach(rel => {
            const childRows = table(data, rel.childTable);
            data[rel.childTable] = childRows.filter(c => !ids.has(c[rel.fk]));
          });
          data[this.name] = rows.filter(r => !this._match(r));
          saveAll(data);
          return { data: null, error: null };
        }
        // select
        let result = rows.filter(r => this._match(r)).map(r => ({ ...r }));
        embed(data, result, this.selectStr);
        if (this.orderBy) {
          const { col, ascending } = this.orderBy;
          result.sort((a, b) => (a[col] > b[col] ? 1 : a[col] < b[col] ? -1 : 0) * (ascending ? 1 : -1));
        }
        if (this._limit != null) result = result.slice(0, this._limit);
        return { data: this._single ? (result[0] || null) : result, error: null };
      } catch (err) {
        return { data: null, error: (err && err.code) ? err : { message: String(err && err.message || err) } };
      }
    }

    then(resolve, reject) { try { resolve(this._run()); } catch (e) { if (reject) reject(e); else throw e; } }
  }

  return { from(name) { return new LocalQuery(name); } };
}

// ── SUPABASE ──────────────────────────────────────────────────────────────────
const SUPABASE_CONFIGURED = SUPABASE_URL !== 'YOUR_SUPABASE_URL';

if (BACKEND === 'local') {
  try { db = createLocalDb(); } catch(e) { console.warn('Local backend init failed:', e); }
} else {

// ── TOAST ─────────────────────────────────────────────────────────────────────
function showToast(msg, color = '#3fb950') {

  t.className = 'toast'; t.style.background = color; t.textContent = msg;

// ── HELPERS ───────────────────────────────────────────────────────────────────
function displayName(p) { const n=NICKNAMES[p]; return n?`${p} "${n}"`:p; }
function fmtBi(v)  { const s=v>0?'+':''; return `${s}${Number(v).toFixed(2)}`; }
function fmtRs(v)  {
  const rs=v*BUYIN_VALUE, s=rs>0?'+':rs<0?'-':'';
  return `${s}₹${Math.abs(rs).toLocaleString('en-IN')}`;
}
function colorCls(v) { return v>0?'pos':v<0?'neg-clr':'neutral'; }
function todayISO() {
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatDate(s) {
  return new Date(s+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}
function formatDateShort(s) {
  return new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'});
}
function formatTime(iso) {
  const d=new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true})
    + ' · ' + d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
}
function notConfiguredMsg(what) {
  return `<p style="color:#f59e0b;text-align:center;padding:3rem 1rem">Connect Supabase to see ${what}.</p>`;
}

// Circular avatar: profile image if the player has one, otherwise a coloured initial.
// `size` is the diameter in px.
function avatarHTML(player, size = 40) {
  const img = PLAYER_IMAGES[player];
  const color = PLAYER_COLORS[player] || '#888';
  if (img) {
    return `<img src="${img}" alt="${player}"
      style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid ${color}" />`;
  }
  const initial = (player || '?').trim().charAt(0).toUpperCase();
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:${Math.round(size*0.45)}px">${initial}</div>`;
}

// Read an image File, downscale/crop it to a square and return a compressed JPEG data URL.
// Keeps the stored value small enough to sit in a normal DB text column.
function fileToAvatarDataURL(file, size = 256) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) { reject(new Error('Not an image')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Invalid image'));
      img.onload = () => {
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function loadPlayers() {
  if (!db) return;
  const { data } = await db.from('players').select('*').order('created_at');
  if (data && data.length > 0) {
    ALL_PLAYER_ROWS = data;
    PLAYERS = data.filter(p => p.active).map(p => p.name);
    data.forEach(p => { PLAYER_COLORS[p.name] = p.color; if (p.image_url) PLAYER_IMAGES[p.name] = p.image_url; });
  }
}

async function checkActiveSession() {
  if (!db) return;
  const { data } = await db.from('active_session').select('*, active_session_buyins(*), active_session_buyin_log(*)').limit(1);
  activeSessionData = (data && data.length > 0) ? data[0] : null;
}

async function init() {
  if (authed) {
    await Promise.all([loadPlayers(), checkActiveSession()]);
  }
  render();
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if (!authed) { app.innerHTML = renderLogin(); bindLogin(); return; }

  // On first render after login, redirect to active session if one exists
  if (!initialRedirectDone) {
    initialRedirectDone = true;
    if (activeSessionData && currentPage !== 'active-session') {
      currentPage = 'active-session';
      history.replaceState(null, '', '#active-session');
    }
  }

  const isProfile = currentPage.startsWith('profile-');
  app.innerHTML = renderNav() + '<div id="page" class="fade-in"></div>';
  const page = document.getElementById('page');
  if      (currentPage === 'leaderboard')    renderLeaderboard(page);
  else if (currentPage === 'new-session')    renderNewSession(page);
  else if (currentPage === 'active-session') renderActiveSession(page);
  else if (currentPage === 'history')        renderHistory(page);
  else if (currentPage === 'awards')         renderAwards(page);
  else if (currentPage === 'players')        renderPlayersPage(page);
  else if (currentPage === 'events')         renderEventsPage(page);
  else if (isProfile)                        renderProfile(page, currentPage.slice(8));
  else renderLeaderboard(page);
  bindNav();
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function renderLogin() {
  return `
  <div style="min-height:100vh;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem">
    <div style="width:100%;max-width:360px">
      <div style="text-align:center;margin-bottom:2rem">
        <div style="font-size:4rem;margin-bottom:0.75rem">🃏</div>
        <h1 style="font-size:1.875rem;font-weight:900;color:var(--text);margin:0">Poker Tracker</h1>
        <p style="color:var(--text2);margin-top:0.25rem">Home game · Members only</p>
      </div>
      <div class="card" style="padding:1.5rem">
        <label style="display:block;color:var(--text2);font-size:0.875rem;font-weight:600;margin-bottom:0.5rem">Password</label>
        <input id="pw" type="password" inputmode="numeric" maxlength="10"
          class="inp" style="width:100%;font-size:1.5rem;letter-spacing:0.3em;padding:1rem;text-align:center;margin-bottom:1rem"
          placeholder="••••" autofocus />
        <button id="login-btn" class="btn-red" style="width:100%;font-size:1.125rem;padding:1rem">Enter</button>
        <p id="pw-err" style="display:none;color:var(--neg);text-align:center;font-size:0.875rem;margin-top:0.75rem">Wrong password, try again</p>
      </div>
    </div>
  </div>`;
}
function bindLogin() {
  const btn=document.getElementById('login-btn'), pw=document.getElementById('pw'), err=document.getElementById('pw-err');
  async function tryLogin() {
    if (pw.value === PASSWORD) {
      authed = true;
      sessionStorage.setItem('poker_auth', '1');
      btn.textContent = 'Loading…'; btn.disabled = true;
      await Promise.all([loadPlayers(), checkActiveSession()]);
      // Render directly rather than via navigate(): if the hash is already
      // '#leaderboard', reassigning it fires no hashchange event, leaving the
      // page stuck on "Loading…". replaceState updates the URL without an event.
      currentPage = 'leaderboard';
      history.replaceState(null, '', '#leaderboard');
      render();
    } else {
      err.style.display = 'block'; pw.value = ''; pw.focus();
    }
  }
  btn.addEventListener('click', tryLogin);
  pw.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
}

// ── NAV ───────────────────────────────────────────────────────────────────────
function renderNav() {
  const active = currentPage.startsWith('profile-') ? 'leaderboard'
               : currentPage === 'active-session'   ? 'new-session'
               : currentPage.startsWith('event-')   ? 'events'
               : currentPage;
  const tabs = [
    { id:'leaderboard', label:'🏆 Board' },
    { id:'new-session',  label: activeSessionData ? '🎮 Live' : '➕ New' },
    { id:'history',      label:'📋 History' },
    { id:'awards',       label:'🎖️ Awards' },
    { id:'players',      label:'👥 Players' },
    { id:'events',       label:'🎯 Events' },
  ];
  return `<div class="nav-bar">
    <div style="max-width:672px;margin:0 auto;padding:0.4rem 0.25rem;display:flex;gap:0.2rem">
      ${tabs.map(t=>`<button data-nav="${t.id}" class="nav-btn ${active===t.id?'active':''}">${t.label}</button>`).join('')}
    </div>
  </div>`;
}
function bindNav() {
  document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => {
    const dest = b.dataset.nav;
    if (dest === 'new-session' && activeSessionData) { navigate('active-session'); return; }
    navigate(dest);
  }));
}

// ── LEADERBOARD ───────────────────────────────────────────────────────────────
async function renderLeaderboard(el) {
  el.innerHTML = `
  <div style="max-width:672px;margin:0 auto;padding:1.5rem 1rem">
    <h2 style="font-size:1.5rem;font-weight:900;margin-bottom:1rem">All-Time Leaderboard</h2>
    <div id="lb-body" style="margin-bottom:1.5rem"><p style="color:var(--text2);text-align:center;padding:3rem 0">Loading...</p></div>
    <div class="card" style="padding:1rem;margin-bottom:1rem">
      <p style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text2);margin-bottom:0.75rem">All Players — Cumulative Buy-ins</p>
      <div style="position:relative;height:220px"><canvas id="combined-chart"></canvas></div>
    </div>
  </div>`;

  if (!db) { document.getElementById('lb-body').innerHTML = notConfiguredMsg('leaderboard'); return; }

  const [{data:results},{data:sessions}] = await Promise.all([
    db.from('session_results').select('player_name, buyins, session_id'),
    db.from('sessions').select('id, date').order('date',{ascending:true})
  ]);

  // Use all known players (DB rows if loaded, else fallback)
  const allNames = ALL_PLAYER_ROWS.length > 0
    ? ALL_PLAYER_ROWS.filter(p => p.is_regular !== false).map(p => p.name)
    : PLAYERS;

  const totals = {};
  allNames.forEach(p => totals[p] = 0);
  (results||[]).forEach(r => {
    if (totals[r.player_name] !== undefined) totals[r.player_name] += Number(r.buyins);
  });
  const sorted = Object.entries(totals).sort((a,b) => b[1]-a[1]);
  const medals = ['🥇','🥈','🥉'];

  document.getElementById('lb-body').innerHTML = sorted.map(([player,total],i) => {
    const rs=total*BUYIN_VALUE, rsSign=rs>0?'+':rs<0?'-':'';
    const retired = ALL_PLAYER_ROWS.find(p=>p.name===player&&!p.active);
    return `<button onclick="navigate('profile-${player}')"
      style="width:100%;text-align:left;display:flex;align-items:center;gap:0.75rem;padding:0.75rem 1rem;margin-bottom:0.5rem;${i===0?'border-color:#f59e0b':''}"
      class="card">
      <div style="font-size:1.4rem;width:2rem;text-align:center">${medals[i]||`<span style="color:var(--text2);font-weight:700;font-size:0.85rem">${i+1}</span>`}</div>
      ${avatarHTML(player,36)}
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;color:${retired?'var(--text2)':'var(--text)'}">${player}${retired?' <span style="font-size:0.65rem;color:var(--text2);font-weight:400">(retired)</span>':''}</div>
        <div style="font-size:0.75rem;color:var(--text2)">${fmtBi(total)} buy-ins</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:1.1rem;font-weight:900" class="${colorCls(total)}">${rsSign}₹${Math.abs(rs).toLocaleString('en-IN')}</div>
      </div>
      <div style="color:var(--text2)">›</div>
    </button>`;
  }).join('');

  if (!sessions||sessions.length===0) return;
  const bySession = {};
  (results||[]).forEach(r=>{ if(!bySession[r.session_id]) bySession[r.session_id]={}; bySession[r.session_id][r.player_name]=Number(r.buyins); });
  const labels = sessions.map(s=>formatDateShort(s.date));
  const chartPlayers = ALL_PLAYER_ROWS.length > 0 ? ALL_PLAYER_ROWS.filter(p=>p.is_regular!==false).map(p=>p.name) : PLAYERS;
  const datasets = chartPlayers.map(player => {
    let running=0;
    const data = sessions.map(s=>{ running+=(bySession[s.id]?.[player]||0); return running; });
    if (data.every(v=>v===0)) return null;
    return { label:player, data, borderColor:PLAYER_COLORS[player]||'#888', backgroundColor:'transparent', borderWidth:2, pointRadius:2, tension:0.3 };
  }).filter(Boolean);

  const ctx = document.getElementById('combined-chart')?.getContext('2d');
  if (ctx && datasets.length > 0) {
    new Chart(ctx, {
      type:'line', data:{labels, datasets},
      options:{
        responsive:true, maintainAspectRatio:false,
        interaction:{mode:'index', intersect:false},
        plugins:{ legend:{display:true, position:'bottom', labels:{color:'#8b949e',font:{size:10},boxWidth:10,padding:8}} },
        scales:{
          x:{ticks:{color:'#8b949e',font:{size:9},maxTicksLimit:6}, grid:{color:'#21262d'}},
          y:{ticks:{color:'#8b949e',font:{size:9}}, grid:{color:'#21262d'}}
        }
      }
    });
  }
}

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem" id="player-select">
        ${PLAYERS.map(p=>`<button data-player="${p}" class="player-pill" style="padding:0.75rem 0.5rem;font-size:0.875rem;text-align:center">${p}</button>`).join('')}
      </div>
    </div>

    <button id="start-btn" class="btn-red" style="display:none;width:100%;font-size:1.125rem;padding:1rem">Start Session →</button>
  </div>`;

  bindNewSessionStart();
}

function bindNewSessionStart() {
  const selected = new Set();

  document.querySelectorAll('.player-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      const p=btn.dataset.player;
      if (selected.has(p)) { selected.delete(p); btn.classList.remove('selected'); }
      else { selected.add(p); btn.classList.add('selected'); }
      document.getElementById('start-btn').style.display = selected.size > 0 ? 'block' : 'none';
    });
  });

  document.getElementById('start-btn').addEventListener('click', async () => {
    if (selected.size === 0) { showToast('Select at least one player','#e53e3e'); return; }
    const date=document.getElementById('session-date').value;
    if (!date) { showToast('Pick a date','#e53e3e'); return; }
    const passcode=document.getElementById('session-passcode').value.trim();
    if (!/^\d{4}$/.test(passcode)) { showToast('Set a 4-digit passcode','#e53e3e'); return; }
    if (!db)   { showToast('Supabase not configured','#e53e3e'); return; }

    const btn=document.getElementById('start-btn');
    btn.textContent='Starting…'; btn.disabled=true;

    const {data:session,error:sErr}=await db.from('active_session').insert({date,passcode}).select().single();
    if (sErr) { showToast('Error starting session','#e53e3e'); btn.textContent='Start Session →'; btn.disabled=false; return; }

    // Everyone starts with 1 buy-in; further buy-ins are recorded during the session.
    const rows=[...selected].map(p=>({
      active_session_id:session.id,
      player_name:p,
      buyins:1
    }));
    const {error:bErr}=await db.from('active_session_buyins').insert(rows);
    if (bErr) { showToast('Error saving buy-ins','#e53e3e'); btn.textContent='Start Session →'; btn.disabled=false; return; }

    const {data:full}=await db.from('active_session').select('*, active_session_buyins(*), active_session_buyin_log(*)').eq('id',session.id).single();
    activeSessionData=full;
    navigate('active-session');
  });
}

async function renderActiveSession(el) {
  if (!activeSessionData) {

}

  const buyins=(s.active_session_buyins||[]).slice().sort((a,b)=>a.player_name.localeCompare(b.player_name));

  const totalBi=buyins.reduce((a,b)=>a+b.buyins,0);

  el.innerHTML=`
  <div style="max-width:672px;margin:0 auto;padding:1.5rem 1rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.25rem">
      <h2 style="font-size:1.5rem;font-weight:900;margin:0">🎮 Session Live</h2>
      <div style="display:flex;align-items:center;gap:0.5rem">
        <div style="width:0.5rem;height:0.5rem;border-radius:50%;background:var(--green)" class="live-pulse"></div>
        <span style="font-size:0.75rem;color:var(--green);font-weight:600">LIVE</span>
      </div>
    </div>
    <p style="color:var(--text2);font-size:0.875rem;margin-bottom:1.25rem">${formatDate(s.date)}</p>

    <!-- Overall committed buy-ins -->
    <div class="card" style="padding:1rem;margin-bottom:1rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem">
        <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text2)">Total Buy-ins</div>
        <div style="font-size:0.75rem;color:var(--text2)">${totalBi} bi · ₹${(totalBi*BUYIN_VALUE).toLocaleString('en-IN')}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:0.75rem">
        ${buyins.map(b=>`
          <div style="display:flex;align-items:center;gap:0.75rem">
            <div style="width:0.5rem;height:0.5rem;border-radius:50%;background:${PLAYER_COLORS[b.player_name]||'#888'};flex-shrink:0"></div>
            <div style="flex:1;font-weight:600;color:var(--text)">${b.player_name}</div>
            <div style="font-weight:900;font-size:1.1rem;color:var(--text)">${b.buyins} <span style="font-size:0.7rem;font-weight:600;color:var(--text2)">bi</span></div>
            <div style="font-size:0.8rem;color:var(--text2);width:4rem;text-align:right;flex-shrink:0">₹${(b.buyins*BUYIN_VALUE).toLocaleString('en-IN')}</div>
          </div>`).join('')}
      </div>
    </div>

    <button id="record-btn" class="btn-red" style="width:100%;font-size:1rem;padding:0.9rem;margin-bottom:0.5rem">+ Record New Buy-in</button>
    <button id="add-player-btn" class="btn-ghost" style="width:100%;font-size:0.95rem;padding:0.8rem;margin-bottom:1rem">+ Add Player to Session</button>

    <!-- History of recorded buy-ins -->
    <div class="card" style="padding:1rem;margin-bottom:1rem">
      <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text2);margin-bottom:0.75rem">Buy-in History</div>
      <div id="buyin-log">
        ${log.length===0
          ? `<p style="color:var(--text2);font-size:0.85rem;text-align:center;padding:1rem 0">No buy-ins recorded yet.</p>`
          : log.map(e=>`
            <div id="log-entry-${e.id}" style="padding:0.5rem 0;border-top:1px solid var(--border)">
              <div style="display:flex;align-items:center;gap:0.75rem">
                <div style="width:0.5rem;height:0.5rem;border-radius:50%;background:${PLAYER_COLORS[e.player_name]||'#888'};flex-shrink:0"></div>
                <div style="flex:1;min-width:0">
                  <div style="font-weight:600;color:var(--text)">${e.player_name} <span style="color:var(--green);font-weight:700">+${e.amount}</span> <span style="font-size:0.7rem;color:var(--text2)">bi</span></div>
                  <div style="font-size:0.72rem;color:var(--text2)">${formatTime(e.created_at)}</div>
                </div>
                <div style="font-size:0.8rem;color:var(--text2);flex-shrink:0">₹${(e.amount*BUYIN_VALUE).toLocaleString('en-IN')}</div>
                <button data-undo-log="${e.id}" data-undo-player="${e.player_name}" data-undo-amount="${e.amount}"
                  class="btn-ghost" style="padding:0.3rem 0.6rem;font-size:0.75rem;flex-shrink:0;color:var(--neg);border-color:rgba(248,81,73,0.25)">✕</button>
              </div>
              <div id="undo-confirm-${e.id}" style="display:none;margin-top:0.5rem;background:var(--bg3);border-radius:0.75rem;padding:0.75rem;display:none">
                <p style="font-size:0.75rem;color:var(--text2);margin:0 0 0.5rem">Enter passcode to undo this buy-in</p>
                <input type="password" id="undo-pass-${e.id}" inputmode="numeric" maxlength="4" placeholder="••••"
                  class="inp" style="display:block;width:100%;padding:0.6rem;font-size:1rem;letter-spacing:0.3em;font-weight:700;text-align:center;color:var(--text);margin-bottom:0.4rem" />
                <p id="undo-err-${e.id}" style="display:none;color:var(--neg);font-size:0.75rem;margin:0 0 0.4rem">Wrong passcode.</p>
                <div style="display:flex;gap:0.5rem">
                  <button data-undo-confirm="${e.id}" class="btn-red" style="flex:1;padding:0.5rem;font-size:0.8rem">Undo Buy-in</button>
                  <button data-undo-cancel="${e.id}" class="btn-ghost" style="flex:1;padding:0.5rem;font-size:0.8rem">Cancel</button>
                </div>
              </div>
            </div>`).join('')}
      </div>
    </div>

    <button id="end-btn" class="btn-red" style="width:100%;font-size:1.125rem;padding:1rem;margin-bottom:0.75rem">End Session & Enter Final Chips →</button>
    <button id="cancel-btn" class="btn-ghost" style="width:100%;font-size:0.875rem;padding:0.75rem">Cancel Session</button>
  </div>`;

  document.getElementById('record-btn').addEventListener('click', () => showRecordBuyinDialog(buyins));

  document.getElementById('add-player-btn').addEventListener('click', () => showAddPlayerDialog(buyins));

  // Undo buy-in log entries
  document.querySelectorAll('[data-undo-log]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.undoLog;
      const confirmDiv = document.getElementById('undo-confirm-'+id);
      if (!confirmDiv) return;
      // Hide any other open undo panels first
      document.querySelectorAll('[id^="undo-confirm-"]').forEach(d => { if (d.id !== 'undo-confirm-'+id) d.style.display='none'; });
      confirmDiv.style.display = confirmDiv.style.display === 'none' ? 'block' : 'none';
      if (confirmDiv.style.display === 'block') document.getElementById('undo-pass-'+id)?.focus();
    });
  });
  document.querySelectorAll('[data-undo-cancel]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('undo-confirm-'+btn.dataset.undoCancel).style.display='none';
    });
  });
  document.querySelectorAll('[data-undo-confirm]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.undoConfirm;
      const undoBtn = document.querySelector(`[data-undo-log="${id}"]`);
      const playerName = undoBtn?.dataset.undoPlayer;
      const amount = parseFloat(undoBtn?.dataset.undoAmount || '0');
      const errEl = document.getElementById('undo-err-'+id);
      const passInput = document.getElementById('undo-pass-'+id);
      if (passInput.value.trim() !== String(activeSessionData.passcode)) {
        errEl.style.display = 'block';
        passInput.value = '';
        passInput.focus();
        return;
      }
      errEl.style.display = 'none';
      btn.textContent = 'Undoing…'; btn.disabled = true;
      // Delete the log row
      const {error: delErr} = await db.from('active_session_buyin_log').delete().eq('id', id);
      if (delErr) { showToast('Error undoing buy-in', '#e53e3e'); btn.textContent='Undo Buy-in'; btn.disabled=false; return; }
      // Decrement the player's running total
      const row = activeSessionData.active_session_buyins.find(b => b.player_name === playerName);
      if (row) {
        const newTotal = Math.max(0, row.buyins - amount);
        await db.from('active_session_buyins').update({buyins: newTotal}).eq('id', row.id);
        row.buyins = newTotal;
      }
      activeSessionData.active_session_buyin_log = (activeSessionData.active_session_buyin_log || []).filter(e => e.id !== id);
      showToast(`Undone — ${playerName} −${amount} bi`, '#6b7280');
      showTrackingView(document.getElementById('page'));
    });
  });

  document.getElementById('end-btn').addEventListener('click', () => showEndView(document.getElementById('page')));

  document.getElementById('cancel-btn').addEventListener('click', ()=>{
    const btn=document.getElementById('cancel-btn');
    btn.outerHTML=`
      <div id="cancel-confirm" class="card" style="padding:1rem;display:flex;flex-direction:column;gap:0.75rem">
        <span style="font-size:0.8rem;color:var(--text2)">Cancel session? All tracking lost. Enter the session passcode to confirm.</span>
        <input type="password" id="cancel-passcode" inputmode="numeric" maxlength="4" placeholder="••••"
          class="inp" style="display:block;width:100%;padding:0.75rem;font-size:1.25rem;letter-spacing:0.3em;font-weight:700;text-align:center;color:var(--text)" />
        <p id="cancel-pass-err" style="display:none;color:var(--neg);font-size:0.8rem;margin:0">Wrong passcode, try again.</p>
        <div style="display:flex;gap:0.5rem">
          <button id="cancel-yes" class="btn-red" style="flex:1;padding:0.625rem 1rem;font-size:0.875rem">Yes, Cancel</button>
          <button id="cancel-no" class="btn-ghost" style="flex:1;padding:0.625rem 1rem;font-size:0.875rem">No</button>
        </div>
      </div>`;
    document.getElementById('cancel-no').addEventListener('click',()=>showTrackingView(document.getElementById('page')));
    document.getElementById('cancel-yes').addEventListener('click', async ()=>{
      const passErr=document.getElementById('cancel-pass-err');
      if (document.getElementById('cancel-passcode').value.trim()!==String(activeSessionData.passcode)) {
        passErr.style.display='block';
        document.getElementById('cancel-passcode').value='';
        return;
      }
      await db.from('active_session').delete().eq('id',activeSessionData.id);
      activeSessionData=null;
      sessionStorage.removeItem('pending_event_id');
      navigate('new-session');
    });
  });
}

// Modal to record a single buy-in: pick player, quantity, and confirm with the
// session passcode. On success it appends a timestamped log row and bumps the
// player's running total, then refreshes the tracking view.
function showRecordBuyinDialog(buyins) {
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,0.6);display:flex;align-items:flex-end;justify-content:center;padding:0';
  overlay.innerHTML=`
    <div class="card fade-in" style="width:100%;max-width:672px;border-radius:1rem 1rem 0 0;padding:1.25rem 1rem 1.5rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
        <h3 style="font-size:1.2rem;font-weight:900;margin:0">Record Buy-in</h3>
        <button id="rec-close" class="btn-ghost" style="width:2rem;height:2rem;padding:0;font-size:1.1rem;display:flex;align-items:center;justify-content:center">✕</button>
      </div>

      <label style="display:block;font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text2);margin-bottom:0.5rem">Player</label>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;margin-bottom:1rem" id="rec-players">
        ${buyins.map(b=>`<button type="button" data-rec-p="${b.player_name}" class="player-pill" style="padding:0.65rem 0.5rem;font-size:0.85rem;text-align:center">${b.player_name}</button>`).join('')}
      </div>

      <label style="display:block;font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text2);margin-bottom:0.5rem">Buy-ins</label>
      <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1rem">
        <button type="button" id="rec-minus" class="btn-ghost" style="width:2.75rem;height:2.75rem;font-size:1.3rem;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0">−</button>
        <div id="rec-qty" style="flex:1;text-align:center;font-weight:900;font-size:1.5rem;color:var(--text)">1</div>
        <button type="button" id="rec-plus" class="btn-ghost" style="width:2.75rem;height:2.75rem;font-size:1.3rem;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0">+</button>
        <div style="font-size:0.85rem;color:var(--text2);width:4.5rem;text-align:right;flex-shrink:0">₹<span id="rec-rs">${BUYIN_VALUE}</span></div>
      </div>

      <label style="display:block;font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text2);margin-bottom:0.5rem">Session Passcode</label>
      <input type="password" id="rec-passcode" inputmode="numeric" maxlength="4" placeholder="••••"
        class="inp" style="display:block;width:100%;padding:0.75rem;font-size:1.2rem;letter-spacing:0.3em;font-weight:700;text-align:center;color:var(--text);margin-bottom:0.5rem" />
      <p id="rec-err" style="display:none;color:var(--neg);font-size:0.8rem;margin:0 0 0.5rem">Wrong passcode, try again.</p>

      <button id="rec-save" class="btn-red" style="width:100%;font-size:1.05rem;padding:0.9rem">Add Buy-in</button>
    </div>`;
  document.body.appendChild(overlay);

  let selectedPlayer=null, qty=1;
  function close(){ overlay.remove(); }
  function refreshQty(){ document.getElementById('rec-rs').textContent=(qty*BUYIN_VALUE).toLocaleString('en-IN'); document.getElementById('rec-qty').textContent=qty; }

  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  document.getElementById('rec-close').addEventListener('click', close);

  overlay.querySelectorAll('[data-rec-p]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedPlayer=btn.dataset.recP;
      overlay.querySelectorAll('[data-rec-p]').forEach(x=>x.classList.toggle('selected', x===btn));
    });
  });
  document.getElementById('rec-plus').addEventListener('click', ()=>{ qty++; refreshQty(); });
  document.getElementById('rec-minus').addEventListener('click', ()=>{ if(qty>1){qty--; refreshQty();} });

  document.getElementById('rec-save').addEventListener('click', async ()=>{
    const err=document.getElementById('rec-err');
    if (!selectedPlayer) { showToast('Pick a player','#e53e3e'); return; }
    const entered=document.getElementById('rec-passcode').value.trim();
    if (entered!==String(activeSessionData.passcode)) {
      err.style.display='block';
      document.getElementById('rec-passcode').value='';
      return;
    }
    err.style.display='none';
    const btn=document.getElementById('rec-save');
    btn.textContent='Adding…'; btn.disabled=true;

    // Append a ledger entry.
    const {data:logRow,error:logErr}=await db.from('active_session_buyin_log')
      .insert({active_session_id:activeSessionData.id, player_name:selectedPlayer, amount:qty})
      .select().single();
    if (logErr) { showToast('Error recording buy-in','#e53e3e'); btn.textContent='Add Buy-in'; btn.disabled=false; return; }

    // Bump the player's running total.
    const row=activeSessionData.active_session_buyins.find(b=>b.player_name===selectedPlayer);
    const newTotal=(row?row.buyins:0)+qty;
    if (row) {
      const {error:upErr}=await db.from('active_session_buyins').update({buyins:newTotal}).eq('id',row.id);
      if (upErr) { showToast('Error updating total','#e53e3e'); btn.textContent='Add Buy-in'; btn.disabled=false; return; }
      row.buyins=newTotal;
    }
    (activeSessionData.active_session_buyin_log ||= []).push(logRow);

    showToast(`${selectedPlayer} +${qty} buy-in${qty>1?'s':''} 🎉`);
    close();
    showTrackingView(document.getElementById('page'));
  });
}

// Modal to add a player who joins mid-session. Unlike New Game (everyone starts
// with exactly 1 buy-in), a late joiner can start with any positive buy-in count.
// Offers only roster players not already in the session, and gates on the passcode.
function showAddPlayerDialog(buyins) {
  const present=new Set(buyins.map(b=>b.player_name));
  const roster=(ALL_PLAYER_ROWS.length>0?ALL_PLAYER_ROWS.filter(p=>p.active).map(p=>p.name):PLAYERS);
  const available=roster.filter(p=>!present.has(p));

  if (available.length===0) { showToast('Everyone is already in this session','#e53e3e'); return; }

  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,0.6);display:flex;align-items:flex-end;justify-content:center;padding:0';
  overlay.innerHTML=`
    <div class="card fade-in" style="width:100%;max-width:672px;border-radius:1rem 1rem 0 0;padding:1.25rem 1rem 1.5rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
        <h3 style="font-size:1.2rem;font-weight:900;margin:0">Add Player</h3>
        <button id="ap-close" class="btn-ghost" style="width:2rem;height:2rem;padding:0;font-size:1.1rem;display:flex;align-items:center;justify-content:center">✕</button>
      </div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;margin-bottom:1rem" id="ap-players">
        ${available.map(p=>`<button type="button" data-ap-p="${p}" class="player-pill" style="padding:0.65rem 0.5rem;font-size:0.85rem;text-align:center">${p}</button>`).join('')}
      </div>

      <label style="display:block;font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text2);margin-bottom:0.5rem">Starting Buy-ins</label>
      <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1rem">
        <input type="text" inputmode="decimal" id="ap-qty" value="1"
          class="inp" style="flex:1;min-width:0;padding:0.75rem;font-size:1.2rem;font-weight:700;text-align:center;color:var(--text)" />
        <div style="font-size:0.85rem;color:var(--text2);width:5.5rem;text-align:right;flex-shrink:0">₹<span id="ap-rs">${BUYIN_VALUE}</span></div>

        class="inp" style="display:block;width:100%;padding:0.75rem;font-size:1.2rem;letter-spacing:0.3em;font-weight:700;text-align:center;color:var(--text);margin-bottom:0.5rem" />
      <p id="ap-err" style="display:none;color:var(--neg);font-size:0.8rem;margin:0 0 0.5rem">Wrong passcode, try again.</p>

      <button id="ap-save" class="btn-red" style="width:100%;font-size:1.05rem;padding:0.9rem">Add Player</button>
    </div>`;
  document.body.appendChild(overlay);

  let selectedPlayer=null;
  function close(){ overlay.remove(); }
  function refreshRs(){
    const q=parseFloat(document.getElementById('ap-qty').value)||0;
    document.getElementById('ap-rs').textContent=(q*BUYIN_VALUE).toLocaleString('en-IN');
  }

  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  document.getElementById('ap-close').addEventListener('click', close);
  document.getElementById('ap-qty').addEventListener('input', refreshRs);

  overlay.querySelectorAll('[data-ap-p]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedPlayer=btn.dataset.apP;
      overlay.querySelectorAll('[data-ap-p]').forEach(x=>x.classList.toggle('selected', x===btn));

  document.getElementById('ap-save').addEventListener('click', async ()=>{
    const err=document.getElementById('ap-err');
    if (!selectedPlayer) { showToast('Pick a player','#e53e3e'); return; }
    const qty=parseFloat(document.getElementById('ap-qty').value);
    if (!(qty>0)) { showToast('Starting buy-ins must be greater than 0','#e53e3e'); return; }
    if (document.getElementById('ap-passcode').value.trim()!==String(activeSessionData.passcode)) {
      err.style.display='block';
      document.getElementById('ap-passcode').value='';
      return;
    }
    err.style.display='none';
    const btn=document.getElementById('ap-save');

    close();
    showTrackingView(document.getElementById('page'));
  });
}

function showEndView(el) {
  const s=activeSessionData;
  const buyins=(s.active_session_buyins||[]).slice().sort((a,b)=>a.player_name.localeCompare(b.player_name));
  const totalBoughtBi=buyins.reduce((a,b)=>a+b.buyins,0);

  el.innerHTML=`
  <div style="max-width:672px;margin:0 auto;padding:1.5rem 1rem">
    <h2 style="font-size:1.5rem;font-weight:900;margin-bottom:0.25rem">Final Buy-in Counts</h2>
    <p style="color:var(--text2);font-size:0.875rem;margin-bottom:1.25rem">Enter each player's final buy-in count (e.g. 2.5) — net is calculated automatically. Winners are positive, losers negative, and the nets must sum to 0.</p>

    <div class="card" style="padding:1rem;margin-bottom:1rem">
      <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text2);margin-bottom:0.75rem">
        Total in play: ${totalBoughtBi} buy-ins · Final counts must sum to ${totalBoughtBi}
      </div>
      <div style="display:flex;flex-direction:column;gap:0.75rem">
        ${buyins.map(b=>`
          <div style="display:flex;align-items:center;gap:0.5rem">
            <div style="width:0.5rem;height:0.5rem;border-radius:50%;background:${PLAYER_COLORS[b.player_name]||'#888'};flex-shrink:0"></div>
            <div style="width:3.5rem;flex-shrink:0;font-weight:600;font-size:0.85rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${b.player_name}</div>
            <div style="font-size:0.68rem;color:var(--text2);flex-shrink:0;white-space:nowrap">${b.buyins}bi in</div>
            <input type="text" inputmode="decimal" id="final-${b.id}" data-id="${b.id}" data-bought="${b.buyins}"
              class="chip-input inp" style="flex:1;min-width:0;padding:0.75rem 0.5rem;font-size:1rem;font-weight:700;text-align:center" placeholder="0" />
            <div id="net-${b.id}" style="width:3.75rem;text-align:right;font-size:0.75rem;font-weight:700;flex-shrink:0;color:var(--text2)">—</div>
          </div>`).join('')}
      </div>
    </div>

    <div id="end-hint" style="display:none;font-size:0.875rem;padding:0.75rem 1rem;border-radius:0.75rem;margin-bottom:0.75rem;background:rgba(245,158,11,0.1);color:#f59e0b;border:1px solid rgba(245,158,11,0.25)">
      ⚠️ <span id="end-hint-text"></span>
    </div>

    <div class="card" style="padding:1rem;margin-bottom:1rem">
      <label style="display:block;font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text2);margin-bottom:0.5rem">Session Passcode</label>
      <input type="password" id="end-passcode" inputmode="numeric" maxlength="4" placeholder="••••"
        class="inp" style="display:block;width:100%;padding:0.75rem;font-size:1.25rem;letter-spacing:0.3em;font-weight:700;text-align:center;color:var(--text)" />
      <p id="end-pass-err" style="display:none;color:var(--neg);font-size:0.8rem;margin:0.5rem 0 0">Wrong passcode, try again.</p>
    </div>

    <button id="save-end-btn" class="btn-red" style="width:100%;font-size:1.125rem;padding:1rem;margin-bottom:0.75rem">Save Session</button>
    <button id="back-to-tracking" class="btn-ghost" style="width:100%;font-size:0.875rem;padding:0.75rem">← Back to Tracking</button>
  </div>`;

  function calcNets() {
    let totalFinal=0; let allFilled=true;
    buyins.forEach(b => {
      const inp=document.getElementById('final-'+b.id);
      const finalBi=parseFloat(inp?.value)||0;
      if (!inp?.value.trim()) allFilled=false;
      const netBi=finalBi-b.buyins;
      totalFinal+=finalBi;
      const netEl=document.getElementById('net-'+b.id);
      if (inp?.value.trim()) {
        netEl.textContent=`${netBi>0?'+':''}${netBi.toFixed(2)}bi`;
        netEl.className=colorCls(netBi);
        netEl.style.cssText='width:3.75rem;text-align:right;font-size:0.75rem;font-weight:700;flex-shrink:0';
      } else {
        netEl.textContent='—'; netEl.style.color='var(--text2)';
      }
    });
    const diff=totalFinal-totalBoughtBi; // diff == sum of nets (must be 0)
    const hint=document.getElementById('end-hint'), ht=document.getElementById('end-hint-text');
    if (Math.abs(diff)>0.01 && allFilled) {
      hint.style.display='block';
      ht.textContent=`Nets sum to ${diff>0?'+':''}${diff.toFixed(2)} but must be 0 — recheck (final counts total ${totalFinal.toFixed(2)}, should be ${totalBoughtBi})`;
    } else hint.style.display='none';
    return diff;
  }

  document.querySelectorAll('.chip-input').forEach(inp=>inp.addEventListener('input',calcNets));
  document.getElementById('back-to-tracking').addEventListener('click',()=>showTrackingView(document.getElementById('page')));

  document.getElementById('save-end-btn').addEventListener('click', async () => {
    for (const b of buyins) {
      if (!document.getElementById('final-'+b.id)?.value.trim()) { showToast('Enter final count for all players','#e53e3e'); return; }
    }
    const diff=calcNets();
    if (Math.abs(diff)>0.01) { showToast(`Nets must sum to 0 (now ${diff>0?'+':''}${diff.toFixed(2)}) — recheck`,'#e53e3e'); return; }

    const passErr=document.getElementById('end-pass-err');
    if (document.getElementById('end-passcode').value.trim()!==String(activeSessionData.passcode)) {
      passErr.style.display='block';
      document.getElementById('end-passcode').value='';
      return;
    }
    passErr.style.display='none';

    const results=buyins.map(b=>{
      const finalBi=parseFloat(document.getElementById('final-'+b.id).value)||0;
      const netBi=Math.round((finalBi-b.buyins)*100)/100;
      return {player_name:b.player_name, buyins:netBi};
    });

    const btn=document.getElementById('save-end-btn');
    btn.textContent='Saving…'; btn.disabled=true;

    const {data:session,error:sErr}=await db.from('sessions').insert({date:activeSessionData.date}).select().single();
    if (sErr) { showToast('Error saving','#e53e3e'); btn.textContent='Save Session'; btn.disabled=false; return; }
    const {error:rErr}=await db.from('session_results').insert(results.map(r=>({session_id:session.id,...r})));
    if (rErr) { showToast('Error saving results','#e53e3e'); btn.textContent='Save Session'; btn.disabled=false; return; }

    await db.from('active_session').delete().eq('id',activeSessionData.id);

    // Link session to event if one was active when this session started
    const pendingEventId = sessionStorage.getItem('pending_event_id');
    if (pendingEventId) {
      await db.from('event_sessions').insert({event_id:pendingEventId, session_id:session.id});
      sessionStorage.removeItem('pending_event_id');
    }

    activeSessionData=null;
    showToast('Session saved! 🎉');
    setTimeout(()=>navigate('history'),800);
  });
}

// ── SESSION HISTORY ───────────────────────────────────────────────────────────
async function renderHistory(el) {
  el.innerHTML = `<div style="max-width:672px;margin:0 auto;padding:1.5rem 1rem">
    <h2 style="font-size:1.5rem;font-weight:900;margin-bottom:1rem">Session History</h2>
    <div id="history-body"><p style="color:var(--text2);text-align:center;padding:3rem 0">Loading…</p></div>
  </div>`;
  await loadHistory();
}

async function loadHistory() {
  const body=document.getElementById('history-body'); if(!body) return;
  if (!db) { body.innerHTML=notConfiguredMsg('history'); return; }
  const {data:sessions,error}=await db.from('sessions').select('*, session_results(*)').order('date',{ascending:false});
  if (error) { body.innerHTML=`<p style="color:var(--neg)">Error loading history.</p>`; return; }
  if (!sessions||sessions.length===0) {
    body.innerHTML=`<div style="text-align:center;padding:3rem 1rem;color:var(--text2)">No sessions yet.<br><span style="font-size:0.875rem">Start one with the ➕ New tab.</span></div>`; return;
  }
  body.innerHTML=sessions.map(s=>renderSessionCard(s)).join('');
  bindHistoryActions();
}

// Sessions freeze 24h after they were created — no more edits or deletes.
// Prefer created_at (a real timestamp); fall back to the session date at midnight.
const LOCK_WINDOW_MS = 24 * 60 * 60 * 1000;
function isSessionLocked(s) {
  const ref = s.created_at ? new Date(s.created_at) : new Date(s.date + 'T00:00:00');
  if (isNaN(ref.getTime())) return false;
  return Date.now() - ref.getTime() > LOCK_WINDOW_MS;
}

function renderSessionCard(s, editing=false) {
  const results=(s.session_results||[]).sort((a,b)=>b.buyins-a.buyins);
  const rows=results.map(r=>{
    const v=Number(r.buyins), rs=v*BUYIN_VALUE, sign=rs>0?'+':rs<0?'-':'';
    if (editing) return `<div style="display:flex;align-items:center;gap:0.5rem;padding:0.375rem 0">
      <div style="width:5rem;flex-shrink:0;font-size:0.875rem;font-weight:600;color:var(--text)">${r.player_name}</div>
      <input type="text" inputmode="decimal" class="edit-input inp" style="flex:1;min-width:0;padding:0.5rem;font-size:0.875rem;font-weight:700;text-align:center"
        data-result-id="${r.id}" value="${r.buyins}" />
      <div style="width:4.5rem;text-align:right;font-size:0.75rem;color:var(--text2)">${v.toFixed(2)} bi</div>
    </div>`;
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:0.375rem 0">
      <span style="font-size:0.875rem;color:var(--text)">${r.player_name}</span>
      <div style="text-align:right">
        <span class="${colorCls(v)}" style="font-size:0.875rem;font-weight:700">${v>0?'+':''}${v.toFixed(2)} bi</span>
        <span style="font-size:0.75rem;color:var(--text2);margin-left:0.5rem">${sign}₹${Math.abs(rs).toLocaleString('en-IN')}</span>
      </div>
    </div>`;
  }).join('');

  const locked=isSessionLocked(s);
  const btns=locked?`
    <div style="display:flex;align-items:center;justify-content:center;gap:0.4rem;margin-top:0.75rem;font-size:0.8rem;color:var(--text2)">
      🔒 <span>Locked — 24h edit window has passed</span>
    </div>`:editing?`
    <div style="display:flex;gap:0.5rem;margin-top:0.75rem">
      <button data-save-session="${s.id}" class="btn-red" style="flex:1;padding:0.625rem;font-size:0.875rem">Save</button>
      <button data-cancel-session="${s.id}" class="btn-ghost" style="flex:1;padding:0.625rem;font-size:0.875rem">Cancel</button>
    </div>`:`
    <div id="btns-${s.id}" style="display:flex;gap:0.5rem;margin-top:0.75rem">
      <button data-edit-session="${s.id}" class="btn-ghost" style="flex:1;padding:0.625rem;font-size:0.875rem">Edit</button>
      <button data-delete-session="${s.id}" style="padding:0.625rem 1rem;font-size:0.875rem;font-weight:600;border-radius:0.75rem;border:1px solid rgba(248,81,73,0.25);color:var(--neg);background:rgba(248,81,73,0.05);cursor:pointer;transition:all 0.15s">Delete</button>
    </div>`;

  return `<div id="session-card-${s.id}" class="card" style="padding:1rem;margin-bottom:0.75rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem">
      <div style="font-weight:900;color:var(--text)">${formatDate(s.date)}</div>
      <div style="font-size:0.75rem;color:var(--text2)">${results.length} players</div>
    </div>
    <div style="border-top:1px solid var(--border)">${rows}</div>
    ${btns}
  </div>`;
}

function bindHistoryActions() {
  document.querySelectorAll('[data-edit-session]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id=btn.dataset.editSession;
      const {data:s}=await db.from('sessions').select('*, session_results(*)').eq('id',id).single();
      document.getElementById('session-card-'+id).outerHTML=renderSessionCard(s,true);
      bindHistoryActions();
    });
  });
  document.querySelectorAll('[data-cancel-session]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id=btn.dataset.cancelSession;
      const {data:s}=await db.from('sessions').select('*, session_results(*)').eq('id',id).single();
      document.getElementById('session-card-'+id).outerHTML=renderSessionCard(s,false);
      bindHistoryActions();
    });
  });
  document.querySelectorAll('[data-save-session]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id=btn.dataset.saveSession;
      const {data:sLock}=await db.from('sessions').select('created_at,date').eq('id',id).single();
      if (sLock && isSessionLocked(sLock)) { showToast('Session is locked — 24h edit window has passed','#e53e3e'); await loadHistory(); return; }
      const inputs=document.querySelectorAll(`#session-card-${id} .edit-input`);
      let sum=0; const updates=[];
      inputs.forEach(inp=>{ const v=parseFloat(inp.value)||0; sum+=v; updates.push({id:inp.dataset.resultId,buyins:v}); });
      if (Math.abs(sum)>0.01) { showToast(`Sum must be 0 (now ${sum>0?'+':''}${sum.toFixed(2)})`, '#e53e3e'); return; }
      btn.textContent='Saving…';
      for (const u of updates) await db.from('session_results').update({buyins:u.buyins}).eq('id',u.id);
      showToast('Updated!');
      await loadHistory();
    });
  });
  document.querySelectorAll('[data-delete-session]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id=btn.dataset.deleteSession;
      const btnsDiv=document.getElementById('btns-'+id);
      if (!btnsDiv) return;
      btnsDiv.innerHTML=`
        <span style="flex:1;font-size:0.8rem;color:var(--text2);display:flex;align-items:center">Sure? This can't be undone.</span>
        <button data-confirm-delete="${id}" class="btn-red" style="padding:0.625rem 1rem;font-size:0.875rem">Yes, Delete</button>
        <button data-cancel-delete="${id}" class="btn-ghost" style="padding:0.625rem 1rem;font-size:0.875rem">Cancel</button>`;
      btnsDiv.querySelector(`[data-cancel-delete]`).addEventListener('click', async ()=>{
        const {data:s}=await db.from('sessions').select('*, session_results(*)').eq('id',id).single();
        document.getElementById('session-card-'+id).outerHTML=renderSessionCard(s,false);
        bindHistoryActions();
      });
      btnsDiv.querySelector(`[data-confirm-delete]`).addEventListener('click', async ()=>{
        const {data:sLock}=await db.from('sessions').select('created_at,date').eq('id',id).single();
        if (sLock && isSessionLocked(sLock)) { showToast('Session is locked — 24h edit window has passed','#e53e3e'); await loadHistory(); return; }
        const {error}=await db.from('sessions').delete().eq('id',id);
        if (error) { showToast('Delete failed: '+error.message,'#e53e3e'); return; }
        showToast('Deleted','#6b7280');
        await loadHistory();
      });
    });
  });
}

      </div>
    </div>
    <div id="profile-body"><p style="color:var(--text2);text-align:center;padding:3rem 0">Loading…</p></div>
  </div>`;

  if (!db) { document.getElementById('profile-body').innerHTML=notConfiguredMsg('profile'); return; }

  const [{data:playerResults},{data:allSessions}]=await Promise.all([
    db.from('session_results').select('buyins,session_id').eq('player_name',player),
    db.from('sessions').select('id,date').order('date',{ascending:true})
  ]);

  if (!playerResults||playerResults.length===0) {
    document.getElementById('profile-body').innerHTML=`<p style="color:var(--text2);text-align:center;padding:3rem 0">${player} hasn't played any sessions yet.</p>`;
    return;
  }

  const dateMap={}; (allSessions||[]).forEach(s=>dateMap[s.id]=s.date);
  const sessions=playerResults
    .map(r=>({buyins:Number(r.buyins),date:dateMap[r.session_id]||''}))
    .filter(r=>r.date)
    .sort((a,b)=>a.date.localeCompare(b.date));

  // total & the cumulative graph keep the historical seed; per-session stats drop it.
  const total=sessions.reduce((a,s)=>a+s.buyins,0);
  const realSessions=sessions.filter(s=>!isHistoricalDate(s.date));
  const bi=realSessions.map(s=>s.buyins);
  const count=bi.length;
  const wins=bi.filter(v=>v>0).length;
  const winRate=count?Math.round((wins/count)*100):0;
  const bigWin=count?Math.max(...bi):0;
  const bigLoss=count?Math.min(...bi):0;

  let streak=0, streakType='';
  for (let i=bi.length-1;i>=0;i--) {
    const isW=bi[i]>0;
    if (streak===0){streakType=isW?'win':'loss';streak=1;}
    else if((streakType==='win'&&isW)||(streakType==='loss'&&!isW))streak++;
    else break;
  }
  const streakLabel=streak===0?'—':streak===1?(streakType==='win'?'1 Win':'1 Loss'):`${streak} ${streakType==='win'?'Wins':'Losses'} in a row`;
  const streakColor=streak===0?'var(--text2)':streakType==='win'?'var(--green)':'var(--neg)';
  const streakIcon=streak===0?'🂠':streakType==='win'?'🔥':'❄️';

  let running=0;
  const cumulative=sessions.map(s=>{running+=s.buyins;return{date:s.date,value:running};});

  function statBox(label,value,cls){
    return `<div class="card2" style="padding:0.75rem">
      <div style="font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text2);margin-bottom:0.25rem">${label}</div>
      <div class="${cls}" style="font-size:1.25rem;font-weight:900">${value}</div>
    </div>`;
  }

  document.getElementById('profile-body').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1rem">
      ${statBox('Total (buy-ins)',fmtBi(total),colorCls(total))}
      ${statBox('Total (₹)',fmtRs(total),colorCls(total))}
      ${statBox('Sessions',count,'neutral')}
      ${statBox('Win Rate',`${winRate}%`,winRate>=50?'pos':'neg-clr')}
      ${statBox('Best Session',`+${bigWin.toFixed(2)} bi`,'pos')}
      ${statBox('Worst Session',`${bigLoss.toFixed(2)} bi`,'neg-clr')}
    </div>
    <div class="card" style="padding:0.875rem;margin-bottom:1rem;display:flex;align-items:center;gap:0.75rem">
      <div style="font-size:1.75rem">${streakIcon}</div>
      <div>
        <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text2)">Current Streak</div>
        <div style="font-weight:900;font-size:1.1rem;color:${streakColor}">${streakLabel}</div>
      </div>
    </div>
    <div class="card" style="padding:1rem">
      <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text2);margin-bottom:0.75rem">Cumulative Buy-ins Over Time</div>
      <div style="position:relative;height:180px"><canvas id="profile-chart"></canvas></div>
    </div>`;

  const ctx=document.getElementById('profile-chart')?.getContext('2d');
  if (ctx&&cumulative.length>0) {
    new Chart(ctx,{
      type:'line',
      data:{
        labels:cumulative.map(d=>formatDateShort(d.date)),
        datasets:[{
          data:cumulative.map(d=>d.value),
          borderColor:PLAYER_COLORS[player]||'#888', backgroundColor:(PLAYER_COLORS[player]||'#888')+'22',
          borderWidth:2.5, pointRadius:4, pointBackgroundColor:PLAYER_COLORS[player]||'#888',
          fill:true, tension:0.3
        }]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{
          x:{ticks:{color:'#8b949e',font:{size:10}},grid:{color:'#21262d'}},
          y:{ticks:{color:'#8b949e',font:{size:10}},grid:{color:'#21262d'}}
        }
      }
    });
  }
}

// ── AWARDS ────────────────────────────────────────────────────────────────────
async function renderAwards(el) {
  el.innerHTML=`<div style="max-width:672px;margin:0 auto;padding:1.5rem 1rem">
    <h2 style="font-size:1.5rem;font-weight:900;margin-bottom:0.25rem">🎖️ Awards</h2>
    <p style="color:var(--text2);font-size:0.875rem;margin-bottom:1.25rem">Auto-calculated from all sessions · Updated live</p>
    <div id="awards-body"><p style="color:var(--text2);text-align:center;padding:3rem 0">Loading…</p></div>
  </div>`;

  if (!db) { document.getElementById('awards-body').innerHTML=notConfiguredMsg('awards'); return; }

  const [{data:results},{data:sessions}]=await Promise.all([
    db.from('session_results').select('player_name,buyins,session_id'),
    db.from('sessions').select('id,date').order('date',{ascending:true})
  ]);

  if (!results||results.length===0) {
    document.getElementById('awards-body').innerHTML=`<p style="color:var(--text2);text-align:center;padding:3rem 0">No sessions yet — play some games first! 🃏</p>`;
    return;
  }

  const sessionMap={}; (sessions||[]).forEach(s=>sessionMap[s.id]=s.date);
  const allNames=ALL_PLAYER_ROWS.length>0?ALL_PLAYER_ROWS.map(p=>p.name):PLAYERS;
  const pData={};
  allNames.forEach(p=>pData[p]=[]);
  (results||[]).forEach(r=>{
    // Awards never count the historical accumulation seed.
    if (isHistoricalDate(sessionMap[r.session_id])) return;
    if (!pData[r.player_name]) pData[r.player_name]=[];
    pData[r.player_name].push({buyins:Number(r.buyins),date:sessionMap[r.session_id]||'',sessionId:r.session_id});
  });
  Object.keys(pData).forEach(p=>pData[p].sort((a,b)=>a.date.localeCompare(b.date)));

  const allPNames=Object.keys(pData);
  const bySessions=allPNames.filter(p=>pData[p].length>0).sort((a,b)=>pData[b].length-pData[a].length);
  const ironManP=bySessions[0];

  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-30);
  const cutoffISO=cutoff.toISOString().slice(0,10);
  const recentNet=allPNames.map(p=>{
    const recent=pData[p].filter(r=>r.date>=cutoffISO);
    return {player:p,total:recent.reduce((a,r)=>a+r.buyins,0),count:recent.length};
  }).filter(x=>x.count>0).sort((a,b)=>a.total-b.total);
  const donatorP=recentNet[0];

  const latestSession=sessions?.[sessions.length-1];
  let hotHandR=null;
  if (latestSession) {
    const lRes=results.filter(r=>r.session_id===latestSession.id).sort((a,b)=>b.buyins-a.buyins);
    if (lRes.length) hotHandR=lRes[0];
  }

  let comebackP=null, comebackV=-Infinity;
  allPNames.forEach(p=>{
    const s=pData[p];
    for (let i=2;i<s.length;i++) {
      if (s[i-1].buyins<0&&s[i-2].buyins<0&&s[i].buyins>comebackV){comebackV=s[i].buyins;comebackP=p;}
    }
  });

  const swings=allPNames.map(p=>{
    const d=pData[p]; if(d.length<2) return null;
    return {player:p,avg:d.reduce((a,r)=>a+Math.abs(r.buyins),0)/d.length};
  }).filter(Boolean).sort((a,b)=>a.avg-b.avg);
  const rockP=swings[0];

  function awardCard(icon,title,winner,desc,flavor){
    const color=winner?PLAYER_COLORS[winner]||'#888':'#888';
    return `<div class="card award-card" style="padding:1rem;margin-bottom:0.875rem">
      <div style="display:flex;align-items:flex-start;gap:0.875rem">
        <div style="font-size:2rem;line-height:1">${icon}</div>
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.375rem">
            <span style="font-weight:900;font-size:1.05rem;color:var(--text)">${title}</span>
            ${winner?`<div style="width:0.5rem;height:0.5rem;border-radius:50%;background:${color}"></div>`:''}
          </div>
          <p style="font-size:0.875rem;color:var(--text2);margin:0 0 0.375rem">${desc}</p>
          ${flavor?`<p style="font-size:0.8rem;font-style:italic;color:var(--red);margin:0">"${flavor}"</p>`:''}
        </div>
      </div>
    </div>`;
  }

  document.getElementById('awards-body').innerHTML=[
    awardCard('💪','Iron Man',ironManP,
      ironManP?`${displayName(ironManP)} has played the most — ${pData[ironManP].length} sessions and counting.`:'No data yet.',
      ironManP?`${displayName(ironManP)} never misses a game.`:''
    ),
    awardCard('💸','Donator of the Month',donatorP?.player,
      donatorP?`${displayName(donatorP.player)} has generously contributed ${fmtBi(donatorP.total)} buy-ins (${fmtRs(donatorP.total)}) to the table in the last 30 days.`:'No losses in the last 30 days!',
      donatorP?`${displayName(donatorP.player)} keeps the game alive. 🙏`:''
    ),
    awardCard('🔥','Hot Hand',hotHandR?.player_name,
      hotHandR?`${displayName(hotHandR.player_name)} led the last session with +${Number(hotHandR.buyins).toFixed(2)} bi (${fmtRs(Number(hotHandR.buyins))}).`:'No sessions played yet.',
      hotHandR?`${displayName(hotHandR.player_name)} is running hot right now.`:''
    ),
    awardCard('👑','Comeback King',comebackP,
      comebackP?`${displayName(comebackP)} pulled off the biggest win after back-to-back losses: +${comebackV.toFixed(2)} bi (${fmtRs(comebackV)}).`:'Need at least 3 sessions per player to calculate this.',
      comebackP?`Never count out ${displayName(comebackP)}.`:''
    ),
    awardCard('🪨','Rock of the Table',rockP?.player,
      rockP?`${displayName(rockP.player)} is the most consistent — average swing of just ${rockP.avg.toFixed(2)} buy-ins per session.`:'Need more sessions.',
      rockP?`${displayName(rockP.player)} — steady as a rock.`:''
    ),
  ].join('');
}

// ── PLAYERS PAGE ──────────────────────────────────────────────────────────────
async function renderPlayersPage(el) {
  el.innerHTML=`<div style="max-width:672px;margin:0 auto;padding:1.5rem 1rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.25rem">
      <h2 style="font-size:1.5rem;font-weight:900;margin:0">👥 Players</h2>
      <button id="toggle-add-player" class="btn-red" style="padding:0.5rem 1rem;font-size:0.85rem;font-weight:700">+ Add Player</button>
    </div>
    <p style="color:var(--text2);font-size:0.875rem;margin-bottom:1.25rem">Manage your group</p>
    <div id="players-body"><p style="color:var(--text2);text-align:center;padding:3rem 0">Loading…</p></div>
  </div>`;

  document.getElementById('toggle-add-player').addEventListener('click', ()=>{
    const box=document.getElementById('add-player-box');
    if (!box) return;
    const showing=box.style.display!=='none';
    box.style.display=showing?'none':'block';
    if (!showing) document.getElementById('new-player-name')?.focus();
  });

  await loadPlayersPage();
}

async function loadPlayersPage() {
  const body=document.getElementById('players-body'); if (!body) return;
  if (!db) { body.innerHTML=notConfiguredMsg('players'); return; }

  const {data:players}=await db.from('players').select('*').order('created_at');
  if (!players) return;

  ALL_PLAYER_ROWS=players;
  PLAYERS=players.filter(p=>p.active).map(p=>p.name);
  players.forEach(p=>{PLAYER_COLORS[p.name]=p.color; PLAYER_IMAGES[p.name]=p.image_url||null;});

  const active=players.filter(p=>p.active);
  const retired=players.filter(p=>!p.active);

  body.innerHTML=`
    <div id="add-player-box" class="card" style="padding:1rem;margin-bottom:1.25rem;display:none">
      <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text2);margin-bottom:0.75rem">Add New Player</div>
      <input type="text" id="new-player-name" class="inp" placeholder="Player name" style="display:block;width:100%;padding:0.75rem;font-size:0.9rem;margin-bottom:0.75rem" maxlength="20" />
      <div style="font-size:0.75rem;color:var(--text2);margin-bottom:0.5rem">Pick a colour</div>
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.75rem" id="add-swatches">
        ${COLOR_PRESETS.map(c=>`<button type="button" data-ac="${c}" class="color-swatch" style="width:2rem;height:2rem;border-radius:50%;background:${c};border:2px solid transparent;cursor:pointer"></button>`).join('')}
      </div>
      <input type="hidden" id="new-player-color" value="${COLOR_PRESETS[0]}" />
      <button id="add-player-submit" class="btn-red" style="width:100%;padding:0.75rem;font-size:0.9rem">+ Add Player</button>
    </div>

    <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text2);margin-bottom:0.5rem">Active (${active.length})</div>
    ${active.map(p=>playerRowHTML(p,false)).join('')}

    ${retired.length>0?`
    <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text2);margin:1rem 0 0.5rem">Retired (${retired.length})</div>
    ${retired.map(p=>playerRowHTML(p,true)).join('')}
    `:''}
  `;

  // Select first color swatch by default
  selectAddColor(COLOR_PRESETS[0]);

  document.querySelectorAll('[data-ac]').forEach(s=>{
    s.addEventListener('click',()=>selectAddColor(s.dataset.ac));
  });

  document.getElementById('add-player-submit').addEventListener('click', async ()=>{
    const name=document.getElementById('new-player-name').value.trim();
    const color=document.getElementById('new-player-color').value;
    if (!name){showToast('Enter a player name','#e53e3e');return;}
    const btn=document.getElementById('add-player-submit');
    btn.textContent='Adding…';btn.disabled=true;
    const {error}=await db.from('players').insert({name,color});
    if (error){
      showToast(error.code==='23505'?'Player already exists':'Error adding player','#e53e3e');
      btn.textContent='+ Add Player';btn.disabled=false;return;
    }
    showToast(`${name} added!`);
    await loadPlayersPage();
  });

  document.querySelectorAll('[data-edit-p]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const p=ALL_PLAYER_ROWS.find(x=>x.id===btn.dataset.editP);
      if(p) showEditRow(p);
    });
  });
  document.querySelectorAll('[data-retire-p]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const p=ALL_PLAYER_ROWS.find(x=>x.id===btn.dataset.retireP);
      if (!confirm(`Retire ${p?.name}? They won't appear in new sessions but their history stays.`)) return;
      await db.from('players').update({active:false}).eq('id',btn.dataset.retireP);
      showToast(`${p?.name} retired`);
      await loadPlayersPage();
    });
  });
  document.querySelectorAll('[data-reactivate-p]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const p=ALL_PLAYER_ROWS.find(x=>x.id===btn.dataset.reactivateP);
      await db.from('players').update({active:true}).eq('id',btn.dataset.reactivateP);
      showToast(`${p?.name} reactivated!`);
      await loadPlayersPage();
    });
  });
}

function playerRowHTML(p, retired) {
  return `<div id="prow-${p.id}" class="card" style="padding:0.875rem 1rem;margin-bottom:0.5rem;display:flex;align-items:center;gap:0.75rem">
    ${avatarHTML(p.name,36)}
    <div style="flex:1;min-width:0">
      <div style="font-weight:600;color:${retired?'var(--text2)':'var(--text)'}">${p.name}</div>
      <div style="font-size:0.65rem;color:${p.is_regular!==false?'var(--green)':'var(--text2)'};font-weight:600">${p.is_regular!==false?'Regular':'Guest'}</div>
    </div>
    ${retired
      ? `<button data-reactivate-p="${p.id}" class="btn-ghost" style="padding:0.375rem 0.75rem;font-size:0.75rem">Reactivate</button>`
      : `<button data-edit-p="${p.id}" class="btn-ghost" style="padding:0.375rem 0.75rem;font-size:0.75rem">Edit</button>
         <button data-retire-p="${p.id}" style="padding:0.375rem 0.75rem;font-size:0.75rem;font-weight:600;border-radius:0.75rem;border:1px solid rgba(248,81,73,0.25);color:var(--neg);background:rgba(248,81,73,0.05);cursor:pointer">Retire</button>`
    }
  </div>`;
}

function selectAddColor(color) {
  document.getElementById('new-player-color').value=color;
  document.querySelectorAll('[data-ac]').forEach(s=>{
    s.style.borderColor=s.dataset.ac===color?'#fff':'transparent';
    s.style.transform=s.dataset.ac===color?'scale(1.25)':'scale(1)';
  });
}

  row.innerHTML=`
    <div style="flex:1;display:flex;flex-direction:column;gap:0.5rem;width:100%">
      <div style="display:flex;align-items:center;gap:0.75rem">
        <div id="eavatar-${p.id}">${avatarHTML(p.name,48)}</div>
        <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
          <button type="button" id="ephoto-btn-${p.id}" class="btn-ghost" style="padding:0.4rem 0.75rem;font-size:0.8rem">📷 ${p.image_url?'Change photo':'Add photo'}</button>
          <button type="button" id="ephoto-remove-${p.id}" class="btn-ghost" style="padding:0.4rem 0.75rem;font-size:0.8rem;display:${p.image_url?'inline-block':'none'}">Remove</button>
        </div>
        <input type="file" id="ephoto-input-${p.id}" accept="image/*" style="display:none" />
      </div>
      <input type="hidden" id="eimage-${p.id}" value="${p.image_url||''}" />
      <input type="text" id="ename-${p.id}" class="inp" value="${p.name}" style="padding:0.5rem 0.75rem;font-size:0.9rem;font-weight:600;width:100%" maxlength="20" />
      <div style="display:flex;flex-wrap:wrap;gap:0.375rem" id="eswatches-${p.id}">
        ${COLOR_PRESETS.map(c=>`<button type="button" data-ec-${p.id}="${c}" style="width:1.75rem;height:1.75rem;border-radius:50%;background:${c};border:2px solid ${c===p.color?'#fff':'transparent'};cursor:pointer;transform:${c===p.color?'scale(1.2)':'scale(1)'};transition:all 0.15s"></button>`).join('')}
      </div>
      <input type="hidden" id="ecolor-${p.id}" value="${p.color}" />
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0.5rem 0">
        <div>
          <div style="font-size:0.8rem;font-weight:700;color:var(--text)">Regular Player</div>
          <div style="font-size:0.7rem;color:var(--text2)">Shows on leaderboard</div>
        </div>
        <label style="position:relative;display:inline-block;width:2.75rem;height:1.5rem;flex-shrink:0">
          <input type="checkbox" id="eregular-${p.id}" ${p.is_regular!==false?'checked':''} style="opacity:0;width:0;height:0;position:absolute" />
          <span id="eregular-track-${p.id}" style="position:absolute;inset:0;border-radius:9999px;cursor:pointer;transition:background 0.2s;background:${p.is_regular!==false?'var(--green)':'var(--bg3)'}; border:1px solid var(--border)">
            <span style="position:absolute;top:0.2rem;left:${p.is_regular!==false?'1.35rem':'0.2rem'};width:1.1rem;height:1.1rem;border-radius:50%;background:#fff;transition:left 0.2s" id="eregular-knob-${p.id}"></span>
          </span>
        </label>
      </div>
      <div style="display:flex;gap:0.5rem">
        <button id="esave-${p.id}" class="btn-red" style="flex:1;padding:0.5rem;font-size:0.85rem">Save</button>
        <button id="ecancel-${p.id}" class="btn-ghost" style="flex:1;padding:0.5rem;font-size:0.85rem">Cancel</button>
      </div>
    </div>`;

  document.querySelectorAll(`[data-ec-${p.id}]`).forEach(s=>{
    s.addEventListener('click',()=>{
      const c=s.getAttribute(`data-ec-${p.id}`);
      document.getElementById('ecolor-'+p.id).value=c;
      document.querySelectorAll(`[data-ec-${p.id}]`).forEach(x=>{
        x.style.borderColor=x.getAttribute(`data-ec-${p.id}`)===c?'#fff':'transparent';
        x.style.transform=x.getAttribute(`data-ec-${p.id}`)===c?'scale(1.2)':'scale(1)';
      });
    });
  });

  // Photo upload / preview / remove
  const photoInput=document.getElementById('ephoto-input-'+p.id);
  document.getElementById('ephoto-btn-'+p.id).addEventListener('click',()=>photoInput.click());
  photoInput.addEventListener('change', async()=>{
    const file=photoInput.files?.[0];
    if (!file) return;
    try {
      const dataUrl=await fileToAvatarDataURL(file);
      document.getElementById('eimage-'+p.id).value=dataUrl;
      PLAYER_IMAGES[p.name]=dataUrl;
      document.getElementById('eavatar-'+p.id).innerHTML=avatarHTML(p.name,48);
      document.getElementById('ephoto-remove-'+p.id).style.display='inline-block';
    } catch(err) { showToast('Could not load that image','#e53e3e'); }
    photoInput.value='';
